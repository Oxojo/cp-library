name: headers

on:
  push:
  pull_request:

jobs:
  self-contained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Each library header compiles standalone
        run: |
          set -e
          fail=0
          for h in $(find library -name '*.hpp'); do
            printf '#include "%s"\nint main(){}\n' "$h" > /tmp/standalone.cpp
            if g++ -std=c++20 -fsyntax-only -I . /tmp/standalone.cpp; then
              echo "ok: $h"
            else
              echo "::error file=$h::header is not self-contained"
              fail=1
            fi
          done
          exit $fail

      - name: Library headers do not depend on template.hpp
        run: |
          if grep -rn 'template/template.hpp' library; then
            echo "::error::library headers must not include template.hpp"
            exit 1
          fi
          echo "ok: no dependency on template.hpp"
